<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SocialConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <div class="auth-brand">
          <i class="fa-solid fa-comments"></i>
          <h1>SocialConnect</h1>
        </div>
        <p class="auth-subtitle">Welcome back! Sign in to continue</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="usernameOrEmail">Username or Email</label>
          <div class="input-wrapper">
            <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-control" placeholder="Enter username or email" required autocomplete="username">
            <i class="fa-solid fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <i class="fa-solid fa-lock"></i>
            <i class="fa-solid fa-eye password-toggle"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
          Login <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Create Account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.getCurrentUser();
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
